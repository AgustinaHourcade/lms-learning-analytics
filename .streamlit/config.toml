# Configuración de Streamlit (se lee desde la raíz del repo, también en Streamlit Cloud).
# Los colores son los del sistema visual del rediseño (ver la paleta en app/componentes.py).

[theme]
base = "light"
primaryColor = "#1B4B8F"            # azul de acción
backgroundColor = "#F7F6F3"         # fondo cálido
secondaryBackgroundColor = "#F1EFEA"
textColor = "#1A1917"
linkColor = "#1B4B8F"
linkUnderline = false
borderColor = "#E3E1DC"
dataframeBorderColor = "#EFEDE8"
dataframeHeaderBackgroundColor = "#FCFBF9"
dataframeHeaderTextColor = "#6B6861"
showWidgetBorder = true
baseRadius = "9px"
baseFontSize = 14
# Inter para el texto y Space Grotesk para títulos y números grandes (Google Fonts).
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, sans-serif"
headingFont = "Space Grotesk:https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap, Inter, sans-serif"
headingFontWeights = 600
# Misma paleta categórica que app/componentes.py (las 3 primeras son las materias).
chartCategoricalColors = ["#2563C9", "#D4661F", "#0E8F62", "#7A5AC8", "#C2407A", "#5C7C8A", "#A68A1E", "#3C3A34"]

[theme.sidebar]
backgroundColor = "#FCFBF9"
secondaryBackgroundColor = "#FFFFFF"

[server]
maxUploadSize = 50                  # MB; la trazabilidad completa pesa unos pocos MB

[browser]
gatherUsageStats = false

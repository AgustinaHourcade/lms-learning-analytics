# Configuración de Streamlit (se lee desde la raíz del repo, también en Streamlit Cloud).

[theme]
# Sistema de diseño (rediseño del predictor de abandono): fondo cálido, azul institucional,
# Inter para el texto y Space Grotesk para los títulos. Los mismos valores están en
# app/componentes.py (TOKENS) para el HTML propio y los gráficos de plotly.
base = "light"
primaryColor = "#1B4B8F"
backgroundColor = "#F7F6F3"
secondaryBackgroundColor = "#F1EFEA"
textColor = "#1A1917"
linkColor = "#1B4B8F"
borderColor = "#E3E1DC"
dataframeBorderColor = "#EFEDE8"
showWidgetBorder = true
baseRadius = "9px"
baseFontSize = 14
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Space Grotesk:https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap"
headingFontWeights = [600, 600, 600, 600, 600, 600]
# Misma paleta categórica que app/componentes.py, para los gráficos nativos (st.bar_chart, etc.)
chartCategoricalColors = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#6250d6", "#e34948"]

[theme.sidebar]
backgroundColor = "#FCFBF9"
secondaryBackgroundColor = "#FFFFFF"
borderColor = "#E3E1DC"

[server]
maxUploadSize = 50                  # MB; la trazabilidad completa pesa unos pocos MB

[browser]
gatherUsageStats = false

# Configuración de Streamlit (se lee desde la raíz del repo, también en Streamlit Cloud).
# Sistema visual del rediseño (D48): fondo cálido, tarjetas blancas, Inter para el texto y
# Space Grotesk para títulos y números grandes. Los mismos valores están en app/componentes.py.

[theme]
base = "light"
primaryColor = "#1B4B8F"            # acción
backgroundColor = "#F7F6F3"         # fondo
secondaryBackgroundColor = "#F1EFEA"
textColor = "#1A1917"
linkColor = "#1B4B8F"
linkUnderline = false
borderColor = "#E3E1DC"
dataframeBorderColor = "#EFEDE8"
dataframeHeaderBackgroundColor = "#FBFAF8"
dataframeHeaderTextColor = "#6B6861"
showWidgetBorder = true
baseRadius = "9px"
buttonRadius = "9px"
baseFontSize = 14
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, sans-serif"
headingFont = "Space Grotesk:https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap, Inter, sans-serif"
headingFontWeights = 600
headingFontSizes = ["27px", "17px", "15px"]
metricValueFontSize = "24px"
metricValueFontWeight = 600
# Semáforo (st.badge, st.info, etc. toman estos colores)
greenColor = "#16734A"
greenBackgroundColor = "#E6F2EB"
greenTextColor = "#116040"
yellowColor = "#C98A12"
yellowBackgroundColor = "#FBF0DC"
yellowTextColor = "#7A5000"
orangeColor = "#C98A12"
orangeBackgroundColor = "#FBF0DC"
orangeTextColor = "#7A5000"
redColor = "#B02A20"
redBackgroundColor = "#FBE9E6"
redTextColor = "#93241C"
blueColor = "#1B4B8F"
blueBackgroundColor = "#EAF0F8"
blueTextColor = "#164279"
grayColor = "#6B6861"
grayBackgroundColor = "#EBE9E4"
grayTextColor = "#35332D"
# Misma paleta categórica que app/componentes.py: ALG, AED, PYE y después el resto.
chartCategoricalColors = ["#2563C9", "#D4661F", "#0E8F62", "#C98A12", "#7A4FC4", "#B02A20", "#5E8C2F", "#C2457A"]

[theme.sidebar]
backgroundColor = "#FCFBF9"
secondaryBackgroundColor = "#FFFFFF"

[server]
maxUploadSize = 50                  # MB; la trazabilidad completa pesa unos pocos MB

[browser]
gatherUsageStats = false

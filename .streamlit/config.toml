# Configuración de Streamlit (se lee desde la raíz del repo, también en Streamlit Cloud).
# Sistema visual del rediseño (D53): fondo cálido, tarjetas blancas con borde fino,
# azul de acción y tipografía Inter (texto) + Space Grotesk (títulos y números).

[theme]
base = "light"
primaryColor = "#1B4B8F"            # acción (botones, selección, links)
backgroundColor = "#F7F6F3"         # fondo de la página
secondaryBackgroundColor = "#F1EFEA"
textColor = "#1A1917"
linkColor = "#1B4B8F"
borderColor = "#E3E1DC"
showWidgetBorder = true
baseRadius = "9px"
baseFontSize = 15
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Space Grotesk:https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap"
headingFontWeights = [600, 600, 600, 600, 600, 600]
metricValueFontSize = "1.65rem"
metricValueFontWeight = 600
dataframeHeaderBackgroundColor = "#FCFBF9"
# Misma paleta categórica que app/componentes.py (las tres primeras son las materias).
chartCategoricalColors = ["#2563C9", "#0E8F62", "#D4661F", "#6B4FA8", "#C98A12", "#B8487A", "#4A8FA8", "#7A7468"]

[theme.sidebar]
backgroundColor = "#FCFBF9"
secondaryBackgroundColor = "#F1EFEA"
borderColor = "#E3E1DC"

[server]
maxUploadSize = 50                  # MB; la trazabilidad completa pesa unos pocos MB

[browser]
gatherUsageStats = false
